<title>Blacklist đội VCT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the bet rule and an all-region blacklist up top, then one table per region. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #12161d;
  --ink-2: #4a5160;
  --ink-3: #7a8191;
  --rule: #dfe2e8;
  --accent: #c2263f;
  --ok: #0a7a35;
  --ok-bg: #e3f4e9;
  --strong: #1c5cab;
  --strong-bg: #e2edfb;
  --weak: #b42318;
  --weak-bg: #fde8e6;
  --volatile: #9a5b00;
  --volatile-bg: #fdf0d9;
  --muted-bg: #eceef2;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --ink: #eceef2; --ink-2: #b4bac6; --ink-3: #8a91a0; --rule: #2c323d;
    --accent: #ef5a70; --ok: #5fd38a; --ok-bg: #173323; --strong: #7db3f5; --strong-bg: #172a45;
    --weak: #f28b82; --weak-bg: #3d1c1a; --volatile: #f0b65a; --volatile-bg: #3a2a12; --muted-bg: #262b35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --ink: #eceef2; --ink-2: #b4bac6; --ink-3: #8a91a0; --rule: #2c323d;
  --accent: #ef5a70; --ok: #5fd38a; --ok-bg: #173323; --strong: #7db3f5; --strong-bg: #172a45;
  --weak: #f28b82; --weak-bg: #3d1c1a; --volatile: #f0b65a; --volatile-bg: #3a2a12; --muted-bg: #262b35;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 24px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
header { display: flex; flex-direction: column; gap: 12px; }
.lede { color: var(--ink-2); font-size: 16px; }

.rule { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.rule b { font-family: var(--font-display); font-weight: 600; }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.method div { display: flex; flex-direction: column; gap: 4px; border-top: 2px solid var(--ink); padding-top: 10px; }
.method b { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.method span { color: var(--ink-2); font-size: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--muted-bg); color: var(--ink); white-space: nowrap; }
.chip.bad { background: var(--weak-bg); color: var(--weak); font-weight: 600; }
.bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--ink-3); vertical-align: middle; margin-right: 8px; }
tr.black .bar { background: var(--weak); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.g-tb { background: var(--ok-bg); color: var(--ok); }
.g-manh { background: var(--strong-bg); color: var(--strong); }
.g-yeu { background: var(--weak-bg); color: var(--weak); }
.g-kod { background: var(--volatile-bg); color: var(--volatile); }
.g-na { background: var(--muted-bg); color: var(--ink-3); }

.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.overview .card { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; min-width: 0; }
.overview .card h3 { font-size: 16px; font-weight: 600; }
.overview .label { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-data); }

section.region { display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 1px solid var(--rule); }
.changes { font-size: 14px; color: var(--ink-2); }
.changes b { font-weight: 600; color: var(--ink); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-family: var(--font-data); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
td.r, th.r { text-align: right; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.black td:first-child { font-weight: 600; color: var(--weak); }

.notes { display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); font-size: 14px; }
.notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 72ch; }
footer { color: var(--ink-3); font-size: 13px; }
</style>

<main>
  <header>
    <div class="eyebrow" id="window"></div>
    <h1>Blacklist đội VCT</h1>
    <p class="lede">Mỗi khu vực, các đội có tỉ lệ map kết thúc 13-11 hoặc phải đá hiệp phụ cao nhất trong thời gian gần đây.</p>
  </header>

  <div class="rule">
    <b>Cách dùng</b>
    <span><strong>Không cược map có đội nằm trong blacklist.</strong> Cược đội đang dẫn ≥ 3 round khi tổng round ≥ 17.</span>
  </div>

  <div class="method" id="method"></div>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2>Blacklist theo khu vực</h2>
    <div class="overview" id="overview"></div>
  </section>

  <div id="regions" style="display:flex;flex-direction:column;gap:32px"></div>

  <div class="notes">
    <h2>Lưu ý khi đọc</h2>
    <ul id="notes"></ul>
  </div>

  <footer id="footer"></footer>
</main>

<script>
const DATA = /*DATA*/null;

const REGION_NAMES = { americas: 'Americas', emea: 'EMEA', china: 'China', pacific: 'Pacific' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtDate = iso => { const d = new Date(iso); return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const pct = x => `${Math.round(100 * x)}%`;

document.getElementById('window').textContent = `${DATA.window_days} ngày · ${fmtDate(DATA.from)} – ${fmtDate(DATA.to)} · nguồn vlr.gg`;

document.getElementById('method').innerHTML = [
  ['Chỉ số', 'Tỉ lệ map của đội kết thúc 13-11 (thắng hoặc thua) hoặc phải đá hiệp phụ, trên tổng số map đội đã đá trong kỳ.'],
  ['Blacklist', `${DATA.top} đội có tỉ lệ cao nhất mỗi khu vực. Bằng tỉ lệ thì đội đá nhiều map hơn xếp trên.`],
  ['Dữ liệu', `Chỉ trận giữa hai đội nhượng quyền.${DATA.exclude_events ? ` Không tính các giải: ${DATA.exclude_events.split('|').join(', ')}.` : ''}`],
].map(([b, s]) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');

document.getElementById('overview').innerHTML = DATA.regions.map(r => `
  <div class="card">
    <h3>${REGION_NAMES[r.region]}</h3>
    <span class="label">Blacklist (${r.blacklist.length})</span>
    <div class="chips">${r.blacklist.map(t => `<span class="chip bad">${esc(t)}</span>`).join('') || '<span class="chip">—</span>'}</div>
  </div>`).join('');

const regionsEl = document.getElementById('regions');
for (const r of DATA.regions) {
  const sec = document.createElement('section');
  sec.className = 'region';
  sec.id = r.region;
  const p = r.previous;
  const changes = p
    ? `<p class="changes">So với lần cập nhật ${fmtDate(p.crawled_at)}: ${p.added.length || p.removed.length
        ? [p.added.length && `<b>vào blacklist:</b> ${p.added.map(esc).join(', ')}`, p.removed.length && `<b>ra khỏi blacklist:</b> ${p.removed.map(esc).join(', ')}`].filter(Boolean).join(' · ')
        : 'blacklist không đổi'}.</p>`
    : '';
  const max = Math.max(0.01, ...r.teams.map(t => t.rate));
  sec.innerHTML = `
    <h2>${REGION_NAMES[r.region]}</h2>
    ${changes}
    <div class="table-wrap"><table>
      <thead><tr><th>Đội</th><th>Tỉ lệ 13-11 / OT</th><th class="r">13-11</th><th class="r">Hiệp phụ</th><th class="r">Số map</th></tr></thead>
      <tbody>${r.teams.map(t => `
        <tr class="${t.blacklisted ? 'black' : ''}">
          <td>${esc(t.team)}</td>
          <td class="num"><span class="bar" style="width:${Math.round(80 * t.rate / max)}px"></span>${t.maps ? pct(t.rate) : '—'}</td>
          <td class="r num">${t.c1311}</td>
          <td class="r num">${t.ot}</td>
          <td class="r num">${t.maps}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  regionsEl.appendChild(sec);
}

const notes = [
  'Danh sách được tính lại mỗi ngày từ dữ liệu gần nhất, nên một đội có thể vào hoặc ra blacklist khi có trận mới.',
  'Chỉ tính trận giữa hai đội nhượng quyền tier 1 (48 đội của 4 khu vực). Trận gặp đội Challengers không được tính.',
  'Đội ít thi đấu trong kỳ có ít số liệu, tỉ lệ dễ dao động mạnh.',
  ...(DATA.notes || []),
];
document.getElementById('notes').innerHTML = notes.map(n => `<li>${esc(n)}</li>`).join('');
document.getElementById('footer').textContent = `Dữ liệu crawl từ vlr.gg ngày ${fmtDate(DATA.crawled_at)}. 12 đội nhượng quyền mỗi khu vực theo VCT 2026 Stage 2.`;
</script>
